name: Build CommandKeys

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.11
            project: versions/1.21.11
            artifact: CommandKeys-1.21.11-Fabric.jar
          - minecraft: 1.21.4
            project: versions/1.21.4
            artifact: CommandKeys-1.21.4-Fabric.jar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build mod
        working-directory: ${{ matrix.project }}
        run: gradle --no-daemon clean build
      - name: Stage JAR
        shell: bash
        working-directory: ${{ matrix.project }}
        run: |
          source_jar="$(find build/libs -maxdepth 1 -type f -name '*-1.0.0.jar' ! -name '*-sources-1.0.0.jar' -print -quit)"
          test -n "$source_jar"
          cp "$source_jar" "$GITHUB_WORKSPACE/${{ matrix.artifact }}"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: CommandKeys-Minecraft-${{ matrix.minecraft }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish v1.0.0 release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[publish-release]')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both JARs
        uses: actions/download-artifact@v4
        with:
          pattern: CommandKeys-Minecraft-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub Release and upload JARs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const files = [
              'CommandKeys-1.21.11-Fabric.jar',
              'CommandKeys-1.21.4-Fabric.jar',
            ];
            const { data: release } = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: 'v1.0.0',
              target_commitish: context.sha,
              name: 'CommandKeys v1.0.0',
              body: [
                'Клиентский Fabric-мод для биндов команд Minecraft.',
                '',
                '- Minecraft 1.21.11: `CommandKeys-1.21.11-Fabric.jar`',
                '- Minecraft 1.21.4: `CommandKeys-1.21.4-Fabric.jar`',
              ].join('\n'),
              draft: false,
              prerelease: false,
            });
            for (const name of files) {
              const filePath = `release-assets/${name}`;
              if (!fs.existsSync(filePath)) throw new Error(`Missing release file: ${filePath}`);
              const data = fs.readFileSync(filePath);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name,
                data,
                headers: {
                  'content-type': 'application/java-archive',
                  'content-length': data.length,
                },
              });
            }
